# ===========================================
#  Easy Code Backend - Application Properties
# ===========================================

server.port=8080

# --- H2 In-Memory Database (Development) ---
spring.datasource.url=jdbc:h2:mem:easycodedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto-create tables from JPA entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT Configuration ---
app.jwt.secret=EasyCode_SuperSecret_JWT_Key_2024_@#$%
app.jwt.expiration-ms=86400000

# --- Logging ---
logging.level.com.easycode=DEBUG
